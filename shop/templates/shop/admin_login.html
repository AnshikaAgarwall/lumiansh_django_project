<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — LumiAnsh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fff8f8;
        }

        .cursive {
            font-family: 'Dancing Script', cursive;
        }

        .login-card {
            background: white;
            border: 1px solid #f0d5d5;
            box-shadow: 0 10px 40px rgba(229, 160, 160, 0.1);
        }

        .btn-rose {
            background: #e5a0a0;
            color: white;
        }

        .btn-rose:hover {
            background: #d48e8e;
        }

        .focus-ring:focus {
            border-color: #e5a0a0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(229, 160, 160, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full login-card rounded-3xl p-10 text-center animate-in fade-in duration-700">
        <p class="cursive text-5xl text-[#e5a0a0] mb-2">LumiAnsh</p>
        <p class="text-gray-400 text-xs uppercase tracking-widest mb-10">Admin Portal Access</p>

        <!-- Messages -->
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div
                class="p-3 text-sm rounded-xl {% if message.tags == 'success' %}bg-green-50 text-green-700{% else %}bg-red-50 text-red-700{% endif %} border {% if message.tags == 'success' %}border-green-100{% else %}border-red-100{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5 text-left">
            {% csrf_token %}
            <div>
                <label class="text-xs font-bold uppercase tracking-wider text-gray-400 block mb-2">Username / ID</label>
                <input type="text" name="username" required
                    class="w-full p-4 bg-[#fff8f8] border border-[#f0d5d5] rounded-xl focus-ring transition"
                    placeholder="Enter your admin ID">
            </div>

            <div>
                <label class="text-xs font-bold uppercase tracking-wider text-gray-400 block mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full p-4 bg-[#fff8f8] border border-[#f0d5d5] rounded-xl focus-ring transition"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full btn-rose font-bold py-4 rounded-xl shadow-lg transition transform active:scale-[0.98]">
                Access Dashboard
            </button>
        </form>

        <div class="mt-10">
            <a href="{% url 'home_landing' %}"
                class="text-xs text-gray-400 hover:text-[#e5a0a0] transition underline underline-offset-4">
                ← Return to Shop Home
            </a>
        </div>
    </div>

</body>

</html>
